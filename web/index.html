<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Application</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="eyebrow">Job application</p>
        <h1>Submit your application</h1>
        <p class="subtitle">
          All fields are required. Resume must be a PDF under 5&nbsp;MB.
        </p>
      </header>

      <form id="apply-form" class="card" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
            placeholder="Jane Doe"
          />
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="jane@example.com"
          />
        </div>

        <div class="field">
          <label for="github">GitHub username</label>
          <div class="input-prefix">
            <span class="prefix" aria-hidden="true">@</span>
            <input
              id="github"
              name="github_username"
              type="text"
              required
              placeholder="janedoe"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
            />
          </div>
        </div>

        <div class="field">
          <label for="resume">Resume (PDF)</label>
          <div class="file-drop" id="file-drop">
            <input
              id="resume"
              name="resume"
              type="file"
              accept="application/pdf,.pdf"
              required
            />
            <div class="file-drop-inner" id="file-drop-label">
              <span class="file-icon" aria-hidden="true">PDF</span>
              <span class="file-prompt">Choose a file or drag it here</span>
              <span class="file-hint">Maximum 5 MB</span>
            </div>
          </div>
          <p class="file-name" id="file-name" hidden></p>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary" id="submit-btn">
            Submit application
          </button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
